plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ytbrowser.viewer'
    compileSdk 34

    defaultConfig {
        applicationId "com.ytbrowser.viewer"
        minSdk 24
        targetSdk 34
        // versionCode tự tăng theo thời điểm build (giây kể từ 1970), giống app quay màn hình -
        // để mỗi lần CI build ra APK mới, Android luôn nhận ra bản mới hơn và cho cài đè.
        def buildVersionCode = (System.currentTimeMillis() / 1000L).toInteger()
        versionCode buildVersionCode
        versionName "1.0"
    }

    // Keystore cố định commit sẵn trong repo - cùng 1 chữ ký xuyên suốt để cài đè APK mới lên
    // bản cũ được, không cần gỡ cài lại mỗi lần tải bản mới từ CI.
    signingConfigs {
        viewer {
            storeFile file("../keystore/viewer-debug.keystore")
            storePassword "viewer123"
            keyAlias "viewer"
            keyPassword "viewer123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.viewer
        }
        debug {
            debuggable true
            // CI hiện build assembleDebug, nên gán signingConfig cố định luôn cho debug.
            signingConfig signingConfigs.viewer
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
